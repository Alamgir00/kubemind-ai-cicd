version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "kubemind-cicd"
    CONTAINER_NAME: "kubemind-app"

phases:
  pre_build:
    commands:
      - echo "Region: $AWS_DEFAULT_REGION"
      - AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
  build:
    commands:
      - echo "Running pre-build validation..."
      - test -f application/app/index.html
      - test -f application/Dockerfile
      - test -f application/appspec.yaml
      - test -f application/taskdef.json
      - cd application
      - sed -i "s|ECS_TASK_EXECUTION_ROLE_ARN|$ECS_TASK_EXECUTION_ROLE_ARN|g" taskdef.json
      - sed -i "s|AWS_REGION|$AWS_DEFAULT_REGION|g" taskdef.json
      - echo "Building Docker image..."
      - docker build --pull -t "$REPOSITORY_URI:$IMAGE_TAG" .
      - docker tag "$REPOSITORY_URI:$IMAGE_TAG" "$REPOSITORY_URI:latest"
  post_build:
    commands:
      - echo "Pushing immutable image..."
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - echo "Pushing latest image..."
      - docker push "$REPOSITORY_URI:latest"
      - printf '[{"name":"%s","imageUri":"%s"}]' "$CONTAINER_NAME" "$REPOSITORY_URI:$IMAGE_TAG" > imageDetail.json
      - echo "Generated imageDetail.json:"
      - cat imageDetail.json

artifacts:
  base-directory: application
  files:
    - imageDetail.json
    - appspec.yaml
    - taskdef.json
