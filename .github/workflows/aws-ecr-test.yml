name: KubeMind AI - AWS ECR Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ecr-test:
    name: Test GitHub → AWS ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::650694421089:role/GitHubActions-KubeMind-AI
          aws-region: ap-south-1

      - name: Verify ECR access
        run: |
          aws ecr describe-repositories \
            --repository-names kubemind-cicd \
            --region ap-south-1
